<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2f5d46">
<title>Határvadász gyakorlóteszt</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f5f2;color:#1d2320;min-height:100vh;display:flex;flex-direction:column}
header{background:#2f5d46;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 14px}header h1{margin:0;font-size:1.2rem}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px}
.card{background:#fff;border:1px solid #dde2dc;border-radius:14px;padding:22px;width:100%;max-width:420px}
label{display:block;font-weight:600;margin-bottom:8px}
input{width:100%;font-size:1.1rem;padding:13px 14px;border:1.5px solid #c9d0c9;border-radius:10px;outline:none}
input:focus{border-color:#2f5d46}
button{width:100%;margin-top:14px;background:#2f5d46;color:#fff;border:0;border-radius:10px;padding:14px;font-size:1.05rem;cursor:pointer}
button[disabled]{opacity:.6}
.hiba{color:#b3261e;margin-top:10px;min-height:1.2em;font-size:.95rem}
.small{color:#5f6a64;font-size:.85rem;margin-top:14px}
</style></head><body>
<header><h1>Határvadász gyakorlóteszt</h1></header>
<main><form class="card" id="f" autocomplete="off">
<label for="pw">Jelszó</label>
<input id="pw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Írd be a jelszót" required>
<button id="b" type="submit">Belépés</button>
<div class="hiba" id="h"></div>
<label style="font-weight:400;margin-top:12px;display:flex;gap:8px;align-items:center"><input type="checkbox" id="m" style="width:auto"> Jelszó megjegyzése ezen az eszközön</label>
<p class="small">A tesztet a képzésen kapott jelszóval lehet megnyitni.</p>
</form></main>

const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function nyit(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.d));
  return new TextDecoder().decode(p);
}
async function indit(pw,mentes){
  const b=document.getElementById("b"),h=document.getElementById("h");
  b.disabled=true;b.textContent="Megnyitás…";h.textContent="";
  try{
    const html=await nyit(pw);
    if(mentes){try{localStorage.setItem("hv_pw",pw)}catch(e){}}
    document.open();document.write(html);document.close();
  }catch(e){
    try{localStorage.removeItem("hv_pw")}catch(_){}
    h.textContent="Hibás jelszó.";b.disabled=false;b.textContent="Belépés";
  }
}
